name: Build PodPop APK

on:
push:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  # Checkout current repository
  - name: Checkout repository
    uses: actions/checkout@v4

  # Checkout MAIN branch assets
  - name: Checkout main branch assets
    uses: actions/checkout@v4
    with:
      ref: main
      path: main-assets

  # Setup Java 17
  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  # Setup Gradle
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  # Extract Android project
  - name: Extract project
    shell: bash
    run: |
      mkdir -p project

      if [ -f PodPop_v4_Premium_3D.zip ]; then
        ARCHIVE="PodPop_v4_Premium_3D.zip"
      elif [ -f PodPop_v2_AndroidStudio.zip ]; then
        ARCHIVE="PodPop_v2_AndroidStudio.zip"
      else
        echo "ERROR: Android project ZIP not found!"
        exit 1
      fi

      echo "Extracting $ARCHIVE"
      unzip -q "$ARCHIVE" -d project

  # Locate Android project
  - name: Locate project directory
    shell: bash
    run: |
      SETTINGS_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

      if [ -z "$SETTINGS_FILE" ]; then
        echo "ERROR: Gradle settings file not found!"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$SETTINGS_FILE")

      if [ ! -d "$PROJECT_DIR/app" ]; then
        echo "ERROR: Android app directory not found!"
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Found project: $PROJECT_DIR"

  # Install AirPods PNG
  - name: Install AirPods PNG
    shell: bash
    run: |
      RESOURCE_DIR="$PROJECT_DIR/app/src/main/res/drawable-nodpi"
      mkdir -p "$RESOURCE_DIR"

      if [ -f main-assets/pro2.png ]; then
        cp main-assets/pro2.png "$RESOURCE_DIR/pro2.png"
        echo "Fetched pro2.png from MAIN branch."

      elif [ -f "$RESOURCE_DIR/pro2.png" ]; then
        echo "Using existing pro2.png."

      else
        echo "ERROR: pro2.png not found!"
        exit 1
      fi

  # Build APK
  - name: Build Debug APK
    shell: bash
    run: |
      cd "$PROJECT_DIR"

      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew --no-daemon assembleDebug
      else
        gradle --no-daemon assembleDebug
      fi

  # Upload APK
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: PodPop-Premium-APK
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
