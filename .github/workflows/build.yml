name: Build PodPop APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unzip project
        run: |
          set -euo pipefail
          test -f PodPop_v4_Premium_BuildReady.zip
          mkdir project
          unzip -q PodPop_v4_Premium_BuildReady.zip -d project
          test -f project/settings.gradle.kts

      - name: Use pro2.png from the repo (if present)
        run: |
          if [ -s pro2.png ]; then
            cp pro2.png project/app/src/main/res/drawable-nodpi/pro2.png
            echo "Using pro2.png from repo"
          else
            echo "No pro2.png in repo; using the one inside the zip"
          fi

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodPop-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PodPop build ${{ github.run_number }}
          files: project/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
