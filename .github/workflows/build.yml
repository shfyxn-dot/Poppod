name: Build PodPop APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout MAIN branch assets
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-assets

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          if [ -f PodPop_v4_Premium_BuildReady.zip ]; then
            ARCHIVE="PodPop_v4_Premium_BuildReady.zip"
          elif [ -f PodPop_v4_Premium_3D.zip ]; then
            ARCHIVE="PodPop_v4_Premium_3D.zip"
          elif [ -f PodPop_v4_Premium_Updated_Source.zip ]; then
            ARCHIVE="PodPop_v4_Premium_Updated_Source.zip"
          elif [ -f PodPop_v2_AndroidStudio.zip ]; then
            ARCHIVE="PodPop_v2_AndroidStudio.zip"
          else
            echo "ERROR: Android project ZIP not found in repository root."
            exit 1
          fi
          unzip -q "$ARCHIVE" -d project

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app directory not found."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Install AirPods PNG
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_DIR="$PROJECT_DIR/app/src/main/res/drawable-nodpi"
          mkdir -p "$RESOURCE_DIR"
          if [ -s main-assets/pro2.png ]; then
            cp main-assets/pro2.png "$RESOURCE_DIR/pro2.png"
            echo "Using pro2.png from MAIN branch."
          elif [ -s "$RESOURCE_DIR/pro2.png" ]; then
            echo "MAIN asset unavailable; using bundled pro2.png fallback."
          else
            echo "ERROR: pro2.png not found in MAIN branch or project ZIP."
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PodPop-Premium-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
