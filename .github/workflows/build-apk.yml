name: Build SurvivalVerse Studio APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate project (loose files or inside a zip)
        run: |
          set -u
          if [ -f settings.gradle.kts ]; then
            P=.
          else
            Z=$(ls -t ./*.zip 2>/dev/null | head -n1 || true)
            if [ -z "$Z" ]; then echo "No settings.gradle.kts and no zip in repo root"; ls -la; exit 1; fi
            echo "Using zip: $Z"
            mkdir -p _proj
            unzip -oq "$Z" -d _proj || [ $? -eq 1 ]   # exit 1 = harmless warnings
            S=$(find _proj -name settings.gradle.kts | head -n1)
            if [ -z "$S" ]; then echo "settings.gradle.kts not found inside zip"; find _proj | head -50; exit 1; fi
            P=$(dirname "$S")
          fi
          echo "PROJ=$P" >> "$GITHUB_ENV"
          echo "Project dir: $P"; ls -la "$P"
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SurvivalVerseStudio-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
